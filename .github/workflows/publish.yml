name: publish

# Tag one package to release it: <package-dir>/v<version>, e.g. iam/v0.1.0
on:
  push:
    # The version part is spelled out so only a release tag can start a
    # release. A looser "*/v*" also matches iam/verify and iam/v-next, and a
    # moving pointer tag firing a publish is not a mistake worth allowing.
    # In these patterns "*" stops at a "/", "+" means one or more of the
    # preceding character, and a trailing "*" leaves room for a pre-release
    # suffix such as v1.0.0rc1.
    tags: ["*/v[0-9]+.[0-9]+.[0-9]+*"]
  # Re-runs a release by hand, to one target or both: for when the tag's own
  # run could not reach PyPI (or GitHub) and is too old to re-run, which
  # GitHub stops allowing after 30 days. It rebuilds from the tag; hatchling
  # builds are reproducible, so the files match what the tag's run shipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. iam/v0.1.0"
        required: true
        type: string
      target:
        description: "Where to publish"
        required: true
        type: choice
        options: [both, pypi, github]
        default: both

# The release tag, whichever way the run started. Scripts read it from the
# environment rather than interpolating the input, so it cannot inject shell.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Rebuilds the package's changelog from the commits the tag covers and pushes
  # it to the default branch. It is deliberately not part of the published
  # artifact: the wheel is built from the tagged commit exactly, and a file
  # written after the tag could not be in it without publishing something the
  # tag does not point at.
  changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the whole history to know what each tag covers.
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Rebuild the changelog
        run: |
          package="${GITHUB_REF_NAME%/v*}"
          # --tag names the release explicitly. Without it the tag is only
          # recognised when it happens to sit on a commit that touched the
          # package, so a docs commit landing last would silently produce an
          # "Unreleased" heading instead of the version.
          uv run --with git-cliff git-cliff --config cliff.toml \
            --include-path "packages/${package}/**" \
            --tag-pattern "${package}/v[0-9].*" \
            --tag "${GITHUB_REF_NAME}" \
            --output "packages/${package}/CHANGELOG.md"

      - name: Commit it if it changed
        run: |
          package="${GITHUB_REF_NAME%/v*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "packages/${package}/CHANGELOG.md"; then
            echo "changelog already up to date"
            exit 0
          fi
          git add "packages/${package}/CHANGELOG.md"
          git commit -m "docs(${package}): changelog for ${GITHUB_REF_NAME}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  # Builds and checks the distributions once, so PyPI and the GitHub release
  # ship byte-identical files.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a release tag
        run: |
          if ! echo "${TAG}" | grep -Eq '^[a-z0-9_-]+/v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "not a release tag: ${TAG}"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Resolve package and verify the tag matches its version
        id: package
        run: |
          tag="${TAG}"
          name="${tag%/v*}"
          version="${tag##*/v}"
          dir="packages/${name}"
          test -f "${dir}/pyproject.toml" || { echo "no such package: ${dir}"; exit 1; }
          declared=$(grep -m1 '^version = ' "${dir}/pyproject.toml" | cut -d'"' -f2)
          if [ "${declared}" != "${version}" ]; then
            echo "tag ${tag} does not match ${dir} version ${declared}"; exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - run: uv build --package "$(grep -m1 '^name = ' ${{ steps.package.outputs.dir }}/pyproject.toml | cut -d'"' -f2)" --out-dir dist

      - name: Verify the wheel installs with plain pip
        run: python scripts/check_pip_install.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.target != 'github'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Attaches the same files to a GitHub release, so the package is installable
  # by URL even when PyPI is unavailable. It does not wait on the PyPI job: a
  # PyPI failure must not hold back the release, and vice versa.
  github-release:
    needs: build
    if: github.event_name == 'push' || inputs.target != 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the whole history to find the previous tag.
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Write the release notes
        run: |
          package="${TAG%/v*}"
          # --tag plus --latest gives just this release's section. --tag is
          # needed for the same reason as in the changelog job: without it a
          # tag on a commit that did not touch the package reads "Unreleased".
          uv run --with git-cliff git-cliff --config cliff.toml \
            --include-path "packages/${package}/**" \
            --tag-pattern "${package}/v[0-9].*" \
            --tag "${TAG}" \
            --latest --strip header \
            --output notes.md
          wheel=$(basename dist/*.whl)
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${wheel}"
          cat >> notes.md <<EOF

          ### Install

          \`\`\`sh
          pip install ${url}
          \`\`\`
          EOF

      - name: Create the release, or refresh it on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG##*/v}"
          # PEP 440 pre-releases (a, b, rc, dev) are flagged so they never
          # show as the repository's latest release.
          prerelease=""
          if echo "${version}" | grep -Eq '(a|b|rc|dev)[0-9]*$'; then
            prerelease="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --notes-file notes.md \
              ${prerelease}
          fi
