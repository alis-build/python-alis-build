name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run taplo fmt --check
      # via make so the zero-package guards apply
      - run: make typecheck
      - run: make test

  # Guards the promise that the core has no dependencies, and that a missing
  # extra fails with a message naming what to install rather than a raw
  # ModuleNotFoundError from somewhere inside the package.
  bare-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [alog, iam, lro]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --package alis-build-${{ matrix.package }} --out-dir dist
      - run: python -m venv .bare
      - run: .bare/bin/pip install --quiet dist/*.whl
      - run: python scripts/check_bare_core.py ${{ matrix.package }} .bare/bin/python

  # Guards the "installable with plain pip" requirement: build the wheels, then
  # install and import them in a stock venv with uv nowhere in the picture.
  pip-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make build
      - run: python scripts/check_pip_install.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore
