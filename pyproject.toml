# Workspace root. Not itself published — it only ties the packages/* members
# together for local dev and pins the shared toolchain.
[project]
name = "python-alis-build"
version = "0.0.0"
description = "Monorepo of Alis Build packages for Python"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

# One level only. Release tags are <package>/v<version>, and both the release
# trigger and the tag parsing assume a single segment.
[tool.uv.workspace]
members = ["packages/*"]

# Resolve every member from the local tree instead of PyPI during dev.
[tool.uv.sources]
alis-build-alog = { workspace = true }
alis-build-iam = { workspace = true }
alis-build-lro = { workspace = true }

[dependency-groups]
dev = [
    "alis-build-alog[grpc]",
    "alis-build-iam[authn,authz,grpc]",
    "alis-build-lro[grpc,spanner,tasks]",
    "git-cliff>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16.4",
    "taplo>=0.9.3",
    "types-protobuf>=6.30",
]

# ---------------------------------------------------------------------------
# Shared tool config — applies to every package in the workspace.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
    "C901", # cyclomatic complexity
    "PLR1702", # nesting depth
    "PLR0912", # branches
    "PLR0913", # arguments
    "PLR0915", # statements
]
# PLR1702 is preview-only in ruff 0.16, and it is the only readability signal
# ruff has — there is no cognitive-complexity rule. explicit-preview-rules keeps
# preview to the codes named above; without it, preview rules inside E/W/RUF
# fire too, which is 69 further findings this repo has not opted into.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 4
max-branches = 12
max-args = 6
max-statements = 50
# Relaxed from ruff's 6. Guard clauses produce many early returns on purpose,
# and that reads better than the nested alternative.
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# Fixtures and parametrised tests legitimately run long and branch wide.
"**/tests/**" = ["S101", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
# Namespace packages have no __init__.py, so mypy needs to be told.
namespace_packages = true
explicit_package_bases = true
# google-cloud-spanner and google-api-core ship py.typed but leave many public
# functions unannotated, so strict mode reads a normal call as an untyped one.
# ignore_missing_imports cannot help: the modules are found, just under-typed.
untyped_calls_exclude = ["google.cloud", "google.api_core"]
mypy_path = ["packages/alog/src", "packages/iam/src", "packages/lro/src"]

# grpcio and the generated IAM protos ship no py.typed, so their symbols
# arrive as Any. types-protobuf covers google.protobuf itself.
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "google.api_core.*",
    "google.cloud.*",
    "google.iam.*",
    "google.longrunning.*",
    "google.rpc.*",
    "google.type.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode gives each test module a name derived from its full path, so
# two packages may both have a tests/test_asgi.py. The default mode derives the
# name from the basename alone and refuses the second one it finds.
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
