[project]
name = "alis-build-lro"
version = "0.1.0"
description = "Long-running operations for services on the Alis Build platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Alis Build", email = "admin@alis.build" },
    { name = "Daniel van Niekerk", email = "daniel.van.niekerk@alisx.com" },
    { name = "Newton Nthiga", email = "newton@alisx.com" },
    { name = "Jan Krynauw", email = "jan@alisx.com" },
]
keywords = ["alis", "lro", "longrunning", "operations", "grpc", "spanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Unlike the other packages here, this core is not dependency-free.
# google.longrunning.Operation is a protobuf message, so a bare core could not
# name the type the package exists to manage. See conductor tech-stack.md.
dependencies = ["googleapis-common-protos>=1.60", "protobuf>=4.25"]

[project.optional-dependencies]
grpc = ["grpcio>=1.60"]
spanner = ["google-cloud-spanner>=3.47"]
tasks = ["google-cloud-tasks>=2.16"]

[project.urls]
Homepage = "https://alisx.com/build"
Repository = "https://github.com/alis-build/python-alis-build"
Issues = "https://github.com/alis-build/python-alis-build/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alis"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
