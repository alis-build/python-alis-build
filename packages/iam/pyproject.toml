[project]
name = "alis-build-iam"
version = "0.1.0"
description = "Authentication and authorization for services on the Alis Build platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Alis Build", email = "admin@alis.build" },
    { name = "Alis Build", email = "admin@alis.build" },
    { name = "Alis Build", email = "admin@alis.build" },
]
keywords = ["alis", "iam", "auth", "authn", "authz", "grpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The identity model and wire format are dependency-free. Everything that
# needs a third-party library lives behind an extra.
dependencies = []

[project.urls]
Homepage = "https://alisx.com/build"
Repository = "https://github.com/alis-build/python-alis-build"
Issues = "https://github.com/alis-build/python-alis-build/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout + PEP 420 namespace: ship the whole alis/ tree, which contains no
# __init__.py above alis/build/iam/ so sibling alis.build.* packages can coexist.
[tool.hatch.build.targets.wheel]
packages = ["src/alis"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
