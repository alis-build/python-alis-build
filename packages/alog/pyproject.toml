[project]
name = "alis-build-alog"
version = "0.1.0"
description = "Structured logging for services on the Alis Build platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Alis Build", email = "admin@alis.build" },
    { name = "Newton Nthiga", email = "newton@alisx.com" },
    { name = "Daniel van Niekerk", email = "daniel.van.niekerk@alisx.com" },
    { name = "Jan Krynauw", email = "jan@alisx.com" },
]
keywords = ["alis", "logging", "structured-logging", "cloud-logging", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# Formatting a log line needs nothing but the standard library. Everything
# that reads a transport lives behind an extra.
dependencies = []

[project.optional-dependencies]
# Only for reading trace correlation off incoming call metadata. Formatting a
# log line never needs it, so a service that is not a gRPC server should not
# have to install it.
grpc = ["grpcio>=1.60"]

[project.urls]
Homepage = "https://alisx.com/build"
Repository = "https://github.com/alis-build/python-alis-build"
Issues = "https://github.com/alis-build/python-alis-build/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout + PEP 420 namespace: ship the whole alis/ tree, which contains no
# __init__.py above alis/build/alog/ so sibling alis.build.* packages can coexist.
[tool.hatch.build.targets.wheel]
packages = ["src/alis"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
